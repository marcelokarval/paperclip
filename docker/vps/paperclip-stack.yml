services:
  paperclip:
    image: ${PAPERCLIP_IMAGE:-paperclip}:${VERSION:-latest}
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    networks:
      - portainer_agent_network
    volumes:
      - paperclip_data:/paperclip
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3100
      - SERVE_UI=true
      - PAPERCLIP_HOME=/paperclip
      - PAPERCLIP_INSTANCE_ID=default
      - PAPERCLIP_CONFIG=/paperclip/instances/default/config.json
      - PAPERCLIP_DEPLOYMENT_MODE=${PAPERCLIP_DEPLOYMENT_MODE:-authenticated}
      - PAPERCLIP_DEPLOYMENT_EXPOSURE=${PAPERCLIP_DEPLOYMENT_EXPOSURE:-private}
      - PAPERCLIP_PUBLIC_URL=${PAPERCLIP_PUBLIC_URL:-https://paperclip.example.com}
      - PAPERCLIP_AUTH_PUBLIC_BASE_URL=${PAPERCLIP_AUTH_PUBLIC_BASE_URL:-https://paperclip.example.com}
      - PAPERCLIP_ALLOWED_HOSTNAMES=${PAPERCLIP_ALLOWED_HOSTNAMES:-}
      - PAPERCLIP_ENABLE_COMPANY_DELETION=${PAPERCLIP_ENABLE_COMPANY_DELETION:-false}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://paperclip.example.com}
      - BETTER_AUTH_TRUSTED_ORIGINS=${BETTER_AUTH_TRUSTED_ORIGINS:-https://paperclip.example.com}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-replace-with-32-byte-random-secret}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-replace-with-postgres-password}@postgres:5432/${POSTGRES_DB:-paperclip}}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY:-}
      - PAPERCLIP_STORAGE_PROVIDER=${PAPERCLIP_STORAGE_PROVIDER:-local_disk}
      - PAPERCLIP_STORAGE_LOCAL_DIR=${PAPERCLIP_STORAGE_LOCAL_DIR:-/paperclip/instances/default/storage}
      - PAPERCLIP_STORAGE_S3_BUCKET=${PAPERCLIP_STORAGE_S3_BUCKET:-paperclip}
      - PAPERCLIP_STORAGE_S3_REGION=${PAPERCLIP_STORAGE_S3_REGION:-us-east-1}
      - PAPERCLIP_STORAGE_S3_ENDPOINT=${PAPERCLIP_STORAGE_S3_ENDPOINT:-}
      - PAPERCLIP_STORAGE_S3_PREFIX=${PAPERCLIP_STORAGE_S3_PREFIX:-}
      - PAPERCLIP_STORAGE_S3_FORCE_PATH_STYLE=${PAPERCLIP_STORAGE_S3_FORCE_PATH_STYLE:-true}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - OPENCODE_ALLOW_ALL_MODELS=true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3100/api/health').then((r) => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "2"
          memory: 4096M
        reservations:
          cpus: "0.5"
          memory: 1024M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 180s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 90s
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        delay: 10s
        monitor: 90s
      labels:
        - traefik.enable=true
        - traefik.docker.network=${TRAEFIK_NETWORK:-portainer_agent_network}
        - traefik.http.routers.paperclip.rule=Host(`${PAPERCLIP_HOST:-paperclip.example.com}`)
        - traefik.http.routers.paperclip.entrypoints=websecure
        - traefik.http.routers.paperclip.tls=true
        - traefik.http.routers.paperclip.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-le}
        - traefik.http.routers.paperclip.service=paperclip
        - traefik.http.services.paperclip.loadbalancer.server.port=3100
        - traefik.http.services.paperclip.loadbalancer.server.scheme=http
        - traefik.http.services.paperclip.loadbalancer.passHostHeader=true
        - traefik.http.routers.paperclip-http.rule=Host(`${PAPERCLIP_HOST:-paperclip.example.com}`)
        - traefik.http.routers.paperclip-http.entrypoints=web
        - traefik.http.routers.paperclip-http.middlewares=paperclip-redirect-to-https
        - traefik.http.middlewares.paperclip-redirect-to-https.redirectscheme.scheme=https
        - traefik.http.middlewares.paperclip-redirect-to-https.redirectscheme.permanent=true

volumes:
  paperclip_data:
    external: true
    name: paperclip_data

networks:
  portainer_agent_network:
    external: true
    name: portainer_agent_network
